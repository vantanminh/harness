name: harness-check
description: Run harness doctor and explicitly approved story verification in a target repository
inputs:
  working-directory:
    description: Project directory
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Doctor
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: harness doctor
    - name: Verify stories
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: harness story verify-all --allow-project-command
