name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "27 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@3e6af16ff035267728e2ebc35df5d4c4cf249f81a # v3.30.3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@3e6af16ff035267728e2ebc35df5d4c4cf249f81a # v3.30.3

      - name: Analyze
        uses: github/codeql-action/analyze@3e6af16ff035267728e2ebc35df5d4c4cf249f81a # v3.30.3
        with:
          category: "/language:${{ matrix.language }}"
