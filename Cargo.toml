[package]
name = "harness"
version = "0.26.2"
edition = "2021"
description = "Agent-ready repository harness — CLI with markdown durable SoT"
license = "MIT"
repository = "https://github.com/vantanminh/5harness"
publish = false
default-run = "harness"

[[bin]]
name = "harness"
path = "src/main.rs"

[lib]
name = "harness"
path = "src/lib.rs"

[dependencies]
argon2 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
getrandom = "0.2"
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
url = "2"

[dev-dependencies]
# integration tests spawn CARGO_BIN_EXE_harness
